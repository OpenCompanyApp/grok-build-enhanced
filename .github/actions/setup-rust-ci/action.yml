name: Set up cached Rust CI
description: Install DotSlash and configure branch-scoped Cargo and sccache caches.

inputs:
  cache-namespace:
    description: Stable cache namespace for this logical job.
    required: true
  enable-sccache:
    description: Enable the GitHub Actions sccache backend.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install DotSlash for the pinned protoc wrapper
      uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

    - name: Restore locked Cargo downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-namespace }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-namespace }}-
          cargo-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Install and start sccache
      if: inputs.enable-sccache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.15.0
