name: Fork contracts
run-name: Fork contracts for ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'rebase/**'
      - 'refresh/**'
  workflow_dispatch:
    inputs:
      full_native:
        description: Run native Linux ARM64 and macOS qualification even for a static-only diff
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  static-contracts:
    name: Static fork contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      broad_groups: ${{ steps.impact.outputs.broad_groups }}
      run_rust: ${{ steps.impact.outputs.run_rust }}
      run_native: ${{ steps.impact.outputs.run_native }}
      reason: ${{ steps.impact.outputs.reason }}
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed paths conservatively
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha=${BASE_SHA:-missing}
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            base_sha=$(git rev-parse "$HEAD_SHA^" 2>/dev/null || printf missing)
          fi
          python3 -I -B scripts/ci/impact.py \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate ownership, provenance, CI, release, and hygiene contracts
        shell: bash
        run: scripts/ci/run.sh static

      - name: Summarize selected CI scope
        shell: bash
        env:
          IMPACT_REASON: ${{ steps.impact.outputs.reason }}
          RUN_NATIVE: ${{ steps.impact.outputs.run_native }}
          RUN_RUST: ${{ steps.impact.outputs.run_rust }}
        run: |
          {
            echo '### CI impact'
            echo
            echo "- Rust: \`$RUN_RUST\`"
            echo "- Native: \`$RUN_NATIVE\`"
            echo "- Reason: $IMPACT_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-contracts:
    name: Focused Rust contracts
    if: needs.static-contracts.outputs.run_rust == 'true'
    needs: static-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/rust-contracts
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up cached Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          cache-namespace: rust-contracts

      - name: Exercise focused contracts and composed binary
        shell: bash
        run: scripts/ci/run.sh rust-contracts

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

  broad-rust:
    name: Rust ${{ matrix.group }}
    if: needs.static-contracts.outputs.run_rust == 'true'
    needs: [static-contracts, rust-contracts]
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.static-contracts.outputs.broad_groups) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/${{ matrix.group }}
      CI_TEST_THREADS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up cached Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          cache-namespace: broad-${{ matrix.group }}
          install-ripgrep: ${{ matrix.group == 'core' && 'true' || 'false' }}

      - name: Run ${{ matrix.group }} test group
        shell: bash
        run: scripts/ci/run.sh "${{ matrix.group }}"

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

  native-checks:
    name: Native ${{ matrix.rust_target }}
    if: >-
      always() &&
      needs.static-contracts.result == 'success' &&
      (needs.rust-contracts.result == 'success' || needs.rust-contracts.result == 'skipped') &&
      (needs.static-contracts.outputs.run_native == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_native == true))
    needs: [static-contracts, rust-contracts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - runner: macos-15
            rust_target: aarch64-apple-darwin
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-${{ matrix.rust_target }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up cached Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          cache-namespace: native-${{ matrix.rust_target }}

      - name: Check composed binary on the native host
        shell: bash
        run: scripts/ci/run.sh native "${{ matrix.rust_target }}"

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

  ci-result:
    name: CI result
    if: always()
    needs: [static-contracts, rust-contracts, broad-rust, native-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected lane to pass
        shell: bash
        env:
          BROAD_RESULT: ${{ needs.broad-rust.result }}
          FULL_NATIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_native == true }}
          NATIVE_RESULT: ${{ needs.native-checks.result }}
          RUN_NATIVE: ${{ needs.static-contracts.outputs.run_native }}
          RUN_RUST: ${{ needs.static-contracts.outputs.run_rust }}
          RUST_RESULT: ${{ needs.rust-contracts.result }}
          STATIC_RESULT: ${{ needs.static-contracts.result }}
        run: |
          set -euo pipefail
          require_result() {
            local lane=$1 actual=$2 expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "$lane result is $actual; expected $expected" >&2
              exit 1
            fi
          }

          require_result static "$STATIC_RESULT" success
          if [[ "$RUN_RUST" == true ]]; then
            require_result rust-contracts "$RUST_RESULT" success
            require_result broad-rust "$BROAD_RESULT" success
          else
            require_result rust-contracts "$RUST_RESULT" skipped
            require_result broad-rust "$BROAD_RESULT" skipped
          fi

          if [[ "$RUN_NATIVE" == true || "$FULL_NATIVE" == true ]]; then
            require_result native "$NATIVE_RESULT" success
          else
            require_result native "$NATIVE_RESULT" skipped
          fi
